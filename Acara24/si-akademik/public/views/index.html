<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Mahasiswa — Acara 24</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 1rem; color: #172033; }
    h1 { margin-bottom: .25rem; }
    #status { min-height: 1.5rem; color: #475569; }
    #status.error { color: #b91c1c; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border-bottom: 1px solid #dbe2ea; padding: .65rem; text-align: left; }
    th { background: #f1f5f9; }
    button { padding: .5rem .8rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Data Mahasiswa</h1>
    <p>Data dimuat langsung dari REST API Acara24.</p>
    <button id="refresh" type="button">Muat ulang</button>
    <p id="status" role="status" aria-live="polite">Memuat data...</p>
    <table>
      <thead>
        <tr><th>NIM</th><th>Nama</th><th>Program Studi</th></tr>
      </thead>
      <tbody id="mahasiswa-list"></tbody>
    </table>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
