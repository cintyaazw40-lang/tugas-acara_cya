openapi: 3.0.0
info:
  title: API Sistem Informasi Akademik (MVC)
  version: 1.0.0
  description: REST API mahasiswa dengan registrasi dan autentikasi Bearer JWT.
servers:
  - url: http://localhost/bkpm/Acara23/si-akademik/public
    description: Laragon lokal
tags:
  - name: Authentication
  - name: Mahasiswa
paths:
  /register:
    post:
      tags: [Authentication]
      summary: Registrasi pengguna
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Field wajib tidak lengkap
        '409':
          description: Username atau email sudah digunakan
        '422':
          description: Format email tidak valid
  /login:
    post:
      tags: [Authentication]
      summary: Login dan memperoleh JWT
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          description: Username atau password kosong
        '401':
          description: Kredensial tidak valid
  /mahasiswa:
    get:
      tags: [Mahasiswa]
      summary: Mengambil semua mahasiswa atau satu mahasiswa
      operationId: listMahasiswa
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Data mahasiswa berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MahasiswaReadEnvelope'
        '400':
          description: Format ID tidak valid
        '404':
          description: Mahasiswa tidak ditemukan
    post:
      tags: [Mahasiswa]
      summary: Menambahkan mahasiswa (MahasiswaController::store)
      operationId: createMahasiswa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MahasiswaRequest'
      responses:
        '201':
          description: Mahasiswa berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: JSON atau field wajib tidak valid
        '401':
          description: Token hilang atau tidak valid
        '422':
          description: Validasi data gagal
    put:
      tags: [Mahasiswa]
      summary: Memperbarui mahasiswa (MahasiswaController::update)
      operationId: updateMahasiswa
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MahasiswaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MahasiswaRequest'
      responses:
        '200':
          description: Mahasiswa berhasil diperbarui
        '400':
          description: ID, JSON, atau field wajib tidak valid
        '401':
          description: Token hilang atau tidak valid
        '404':
          description: Mahasiswa tidak ditemukan
        '422':
          description: Validasi data gagal
    delete:
      tags: [Mahasiswa]
      summary: Menghapus mahasiswa (MahasiswaController::destroy)
      operationId: deleteMahasiswa
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MahasiswaId'
      responses:
        '200':
          description: Mahasiswa berhasil dihapus
        '400':
          description: ID tidak valid
        '401':
          description: Token hilang atau tidak valid
        '404':
          description: Mahasiswa tidak ditemukan
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MahasiswaId:
      name: id
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          example: linda
        email:
          type: string
          format: email
          example: linda@example.com
        password:
          type: string
          format: password
          example: rahasia123
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: linda
        password:
          type: string
          format: password
          example: rahasia123
    MahasiswaRequest:
      type: object
      required: [nim, nama, prodi]
      properties:
        nim:
          type: string
          pattern: '^[0-9]{9}$'
          example: '240101019'
        nama:
          type: string
          maxLength: 100
          example: Mahasiswa API
        prodi:
          type: string
          maxLength: 50
          example: Teknik Informatika
    Mahasiswa:
      type: object
      properties:
        id:
          type: integer
        nim:
          type: string
        nama:
          type: string
        prodi:
          type: string
        created_at:
          type: string
          format: date-time
    SuccessEnvelope:
      type: object
      required: [success, message, data, errors, timestamp]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          nullable: true
        errors:
          type: object
        timestamp:
          type: string
          format: date-time
    LoginEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                expires_in:
                  type: integer
                  example: 300
                role:
                  type: string
                  enum: [admin, user]
    MahasiswaReadEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/Mahasiswa'
                - $ref: '#/components/schemas/Mahasiswa'
