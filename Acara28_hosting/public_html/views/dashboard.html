<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistem Informasi Akademik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .foto-kecil { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
        #notif { display: none; padding: 10px 14px; margin: 0 0 16px; border-radius: 6px; }
        #notif.ok { display: block; background: #e6f4ea; color: #1b5e20; }
        #notif.gagal { display: block; background: #fdecea; color: #b00020; }
    </style>
</head>
<body class="bg-light">
    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = 'login.html';
        }
    </script>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div class="d-flex align-items-center gap-3">
                <img src="assets/logo-polije.png" alt="Logo POLIJE" style="width:56px;height:auto;"
                     onerror="this.style.display='none'">
                <div>
                    <h1 class="h3 text-info-emphasis mb-0">Sistem Informasi Akademik</h1>
                    <p class="text-secondary mb-0">Dashboard</p>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span id="info-role" class="text-secondary"></span>
                <button id="btn-logout" class="btn btn-sm btn-outline-secondary">Logout</button>
            </div>
        </div>

        <div id="notif"></div>

        <div class="card border-0 shadow-sm mb-4" style="max-width: 320px;">
            <div class="card-body">
                <p class="text-secondary mb-1">Total mahasiswa</p>
                <p class="h3 mb-0"><strong id="total">...</strong></p>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h5 mb-0">Daftar Mahasiswa</h2>
                    <!-- Acara 27: Tambah dan Ubah dipindah ke halaman sendiri -->
                    <a href="form_tambah.html" class="btn btn-info text-white aksi-admin">Tambah</a>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Foto</th><th>NIM</th><th>Nama</th><th>Program Studi</th>
                                <th class="aksi-admin">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="isi-tabel"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const token   = localStorage.getItem('token');
        const role    = localStorage.getItem('role');
        const isAdmin = role === 'admin';

        document.querySelector('#info-role').textContent = `Login sebagai: ${role}  `;

        if (!isAdmin) {
            document.querySelectorAll('.aksi-admin').forEach(el => el.style.display = 'none');
        }

        document.querySelector('#btn-logout').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            window.location.href = 'login.html';
        });

        // Tugas mandiri 1: notifikasi visual
        function notif(pesan, sukses) {
            const el = document.querySelector('#notif');
            el.textContent = pesan;
            el.className = sukses ? 'ok' : 'gagal';
            clearTimeout(notif.timer);
            notif.timer = setTimeout(() => { el.className = ''; }, 4000);
        }

        function cekUnauthorized(res) {
            if (res.status === 401) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }

        async function muatDataMahasiswa() {
            try {
                const res = await fetch(`${BASE_URL}/mahasiswa`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                cekUnauthorized(res);
                const hasil = await res.json();
                const tbody = document.querySelector('#isi-tabel');
                tbody.innerHTML = '';

                if (!hasil.success) { notif(hasil.message, false); return; }

                document.querySelector('#total').textContent = hasil.data.length;

                if (hasil.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-secondary py-4">Belum ada data</td></tr>';
                    return;
                }

                hasil.data.forEach(m => {
                    const tr = document.createElement('tr');

                    const tdFoto = document.createElement('td');
                    if (m.foto) {
                        const img = document.createElement('img');
                        img.src = `${BASE_URL}/uploads/${m.foto}`;
                        img.alt = m.nama;
                        img.className = 'foto-kecil';
                        tdFoto.appendChild(img);
                    } else {
                        tdFoto.textContent = '-';
                    }
                    tr.appendChild(tdFoto);

                    [m.nim, m.nama, m.prodi].forEach(teks => {
                        const td = document.createElement('td');
                        td.textContent = teks;
                        tr.appendChild(td);
                    });

                    const tdAksi = document.createElement('td');
                    tdAksi.className = 'aksi-admin text-nowrap';
                    if (!isAdmin) tdAksi.style.display = 'none';

                    // Acara 27: tombol Ubah membuka form_edit.html
                    const btnUbah = document.createElement('button');
                    btnUbah.textContent = 'Ubah';
                    btnUbah.className = 'btn btn-sm btn-outline-info me-1';
                    btnUbah.onclick = () => { window.location.href = `form_edit.html?id=${m.id}`; };

                    // Acara 27: tombol Hapus
                    const btnHapus = document.createElement('button');
                    btnHapus.textContent = 'Hapus';
                    btnHapus.className = 'btn btn-sm btn-outline-danger';
                    btnHapus.onclick = () => hapusData(m.id);

                    tdAksi.append(btnUbah, btnHapus);
                    tr.appendChild(tdAksi);
                    tbody.appendChild(tr);
                });
            } catch (err) {
                notif('Gagal memuat data.', false);
            }
        }

        async function hapusData(id) {
            if (!confirm('Hapus data ini?')) return;
            try {
                const res = await fetch(`${BASE_URL}/mahasiswa?id=${id}`, {
                    method: 'DELETE', // diteruskan Router ke MahasiswaController::destroy($id)
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                cekUnauthorized(res);
                const hasil = await res.json();
                notif(hasil.message, hasil.success);
            } catch (err) {
                notif('Tidak dapat terhubung ke server.', false);
            }
            muatDataMahasiswa();
        }

        // Tampilkan notifikasi kiriman dari form_tambah / form_edit
        const flash = sessionStorage.getItem('flash');
        if (flash) {
            const f = JSON.parse(flash);
            notif(f.teks, f.ok);
            sessionStorage.removeItem('flash');
        }

        muatDataMahasiswa();
    </script>
</body>
</html>
