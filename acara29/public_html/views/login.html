<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Informasi Akademik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 420px;">
        <div class="text-center mb-4">
            <img src="assets/logo-polije.png" alt="Logo POLIJE" style="width:64px;height:auto;"
                 onerror="this.style.display='none'">
            <h1 class="h4 text-info-emphasis mt-2 mb-0">Politeknik Negeri Jember</h1>
            <p class="text-secondary">Sistem Informasi Akademik</p>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h2 class="h5 mb-3">Login</h2>

                <form id="form-login">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-info text-white w-100">Masuk</button>
                </form>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="login.js"></script>
</body>
</html>
