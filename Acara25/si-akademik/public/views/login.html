<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Acara 25</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 440px; padding: 0 1rem; color: #172033; }
    form { display: grid; gap: .8rem; }
    label { display: grid; gap: .25rem; }
    input, button { font: inherit; padding: .6rem; }
    #message { min-height: 1.5rem; color: #b91c1c; }
  </style>
</head>
<body>
  <main>
    <h1>Login Sistem Akademik</h1>
    <form id="form-login">
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Login</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <p>Akun praktikum: <code>admin</code> / <code>admin123</code>.</p>
  </main>
  <script src="login.js" defer></script>
</body>
</html>
