<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Acara 25</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 1000px; padding: 0 1rem; color: #172033; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    #management { background: #f1f5f9; padding: 1rem; margin: 1rem 0; }
    form { display: flex; flex-wrap: wrap; gap: .6rem; }
    input, button { font: inherit; padding: .5rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border-bottom: 1px solid #dbe2ea; padding: .65rem; text-align: left; }
    th { background: #f1f5f9; }
    #status.error { color: #b91c1c; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Dashboard Mahasiswa</h1>
        <p>Login sebagai <strong id="role-label"></strong> · Total: <strong id="total">0</strong></p>
      </div>
      <button id="logout" type="button">Logout</button>
    </header>
    <p id="status" role="status" aria-live="polite">Memuat data...</p>
    <section id="management" hidden>
      <h2>Kelola mahasiswa (admin)</h2>
      <form id="mahasiswa-form">
        <input name="nim" inputmode="numeric" pattern="[0-9]{9}" maxlength="9" placeholder="NIM (9 digit)" required>
        <input name="nama" maxlength="100" placeholder="Nama" required>
        <input name="prodi" maxlength="50" placeholder="Program studi" required>
        <button id="save-button" type="submit">Tambah</button>
        <button id="cancel-edit" type="button" hidden>Batal</button>
      </form>
    </section>
    <table>
      <thead>
        <tr><th>NIM</th><th>Nama</th><th>Program Studi</th><th id="actions-heading" hidden>Aksi</th></tr>
      </thead>
      <tbody id="mahasiswa-list"></tbody>
    </table>
  </main>
  <script src="dashboard.js" defer></script>
</body>
</html>
