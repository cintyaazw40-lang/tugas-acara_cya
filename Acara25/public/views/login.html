<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" style="max-width:420px">
    <div class="card">
        <h1>Login</h1>
        <form id="form-login">
            <div><input id="username" placeholder="Username" required style="width:100%"></div>
            <div><input id="password" type="password" placeholder="Password" required style="width:100%"></div>
            <div id="pesan" class="pesan"></div>
            <button type="submit">Masuk</button>
            <a href="index.html" style="margin-left:10px">Lihat data publik</a>
        </form>
    </div>
</div>
<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
